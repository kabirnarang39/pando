# Full production-shaped topology on one machine:
#   Postgres (metadata) + SeaweedFS (S3-compatible object storage)
#   -> pandod server -> regional cache -> node daemon
#
#   docker compose up -d
#   pando clone http://localhost:7420 work --objects http://localhost:7422

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: pando
      POSTGRES_DB: pando
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30

  s3:
    # S3-compatible object storage (SeaweedFS). Swap for AWS S3, GCS or Azure in production.
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data
    volumes: [s3data:/data]
    ports: ["8333:8333"]

  s3-init:
    image: curlimages/curl:8.16.0
    depends_on: [s3]
    entrypoint: >
      sh -c "until curl -s -o /dev/null http://s3:8333/; do sleep 1; done;
             curl -sf -X PUT http://s3:8333/pando"

  server:
    build: .
    image: ghcr.io/kabirnarang39/pando:latest
    depends_on:
      postgres: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }
    command:
      - server
      - --listen=0.0.0.0:7420
      - --metadata=postgres://postgres:pando@postgres/pando
      - --objects=s3://pando/objects
      - --metrics=0.0.0.0:9420
    environment:
      AWS_ACCESS_KEY_ID: pando
      AWS_SECRET_ACCESS_KEY: pando-secret
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://s3:8333
      AWS_ALLOW_HTTP: "true"
      PANDO_LOG_JSON: "true"
    ports: ["7420:7420", "9420:9420"]

  cache:
    image: ghcr.io/kabirnarang39/pando:latest
    depends_on: [server]
    command: [cache, --listen=0.0.0.0:7421, --upstream=http://server:7420, --capacity-mb=1024]
    ports: ["7421:7421"]

  daemon:
    image: ghcr.io/kabirnarang39/pando:latest
    depends_on: [cache]
    command: [daemon, --listen=0.0.0.0:7422, --upstream=http://cache:7421, --dir=/data/daemon,
              --server=http://server:7420, --prefetch=main, --prefetch-interval=300]
    ports: ["7422:7422"]

volumes:
  pgdata:
  s3data:
