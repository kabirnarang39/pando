name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unused dependencies
        uses: bnjbvr/cargo-machete@v0.9.1
      - name: Crates package and build from their published tarballs
        run: cargo package --workspace --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Enable the FUSE mount test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq fuse3
          echo "PANDO_FUSE_TEST=1" >> "$GITHUB_ENV"
      - run: cargo test --workspace --locked

  databases:
    # Same contract suite against real Postgres and CockroachDB (Postgres wire protocol).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: pando, POSTGRES_DB: pando }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - name: Postgres contract
        env: { PANDO_TEST_POSTGRES_URL: "postgres://postgres:pando@localhost:5432/pando" }
        run: cargo test -p pando-adapters --test contract --locked postgres -- --nocapture
      - name: Start CockroachDB
        run: |
          docker run -d --name crdb -p 26257:26257 cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          for i in $(seq 1 60); do docker exec crdb ./cockroach sql --insecure -e 'select 1' && break; sleep 1; done
          docker exec crdb ./cockroach sql --insecure -e 'create database if not exists pando'
      - name: CockroachDB contract
        env: { PANDO_TEST_POSTGRES_URL: "postgres://root@localhost:26257/pando?sslmode=disable" }
        run: cargo test -p pando-adapters --test contract --locked postgres -- --nocapture

  s3:
    # Object storage adapter against a real S3 API (SeaweedFS).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - name: Start SeaweedFS (S3 API)
        run: |
          docker run -d --name s3 -p 8333:8333 chrislusf/seaweedfs:4.48 server -s3
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8333/ && break; sleep 1; done
          curl -sf -X PUT http://localhost:8333/pando
      - name: S3 contract
        env:
          PANDO_TEST_S3_URL: s3://pando/ci
          AWS_ACCESS_KEY_ID: pando
          AWS_SECRET_ACCESS_KEY: pando-secret
          AWS_REGION: us-east-1
          AWS_ENDPOINT: http://localhost:8333
          AWS_ALLOW_HTTP: "true"
        run: cargo test -p pando-adapters --test contract --locked s3 -- --nocapture

  sdks:
    # Python, Go and TypeScript clients against a live, seeded server.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with: { go-version: "1.25", cache-dependency-path: sdk/go/go.sum }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: cargo build --release --locked -p pando-server -p pando
      - name: Start seeded server
        run: |
          eval "$(sdk/test-server.sh)"
          echo "PANDO_URL=$PANDO_URL" >> "$GITHUB_ENV"
      - name: Python
        working-directory: sdk/python
        run: uv run --group dev pytest -q
      - name: Go
        working-directory: sdk/go
        run: go vet ./... && go test ./...
      - name: TypeScript
        working-directory: sdk/typescript
        run: npm ci && npm run build && npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: pando:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
