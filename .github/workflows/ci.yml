name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: cargo test --workspace --locked

  databases:
    # Same contract suite against real Postgres and CockroachDB (Postgres wire protocol).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_PASSWORD: sapwood, POSTGRES_DB: sapwood }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - name: Postgres contract
        env: { SAPWOOD_TEST_POSTGRES_URL: "postgres://postgres:sapwood@localhost:5432/sapwood" }
        run: cargo test -p sapwood-adapters --test contract --locked postgres -- --nocapture
      - name: Start CockroachDB
        run: |
          docker run -d --name crdb -p 26257:26257 cockroachdb/cockroach:latest-v25.2 start-single-node --insecure
          for i in $(seq 1 60); do docker exec crdb ./cockroach sql --insecure -e 'select 1' && break; sleep 1; done
          docker exec crdb ./cockroach sql --insecure -e 'create database if not exists sapwood'
      - name: CockroachDB contract
        env: { SAPWOOD_TEST_POSTGRES_URL: "postgres://root@localhost:26257/sapwood?sslmode=disable" }
        run: cargo test -p sapwood-adapters --test contract --locked postgres -- --nocapture

  s3:
    # Object storage adapter against a real S3 API (MinIO).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: Swatinem/rust-cache@v2
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=sapwood -e MINIO_ROOT_PASSWORD=sapwood-secret minio/minio server /data
          for i in $(seq 1 60); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint sh minio/mc -c "mc alias set l http://localhost:9000 sapwood sapwood-secret && mc mb l/sapwood"
      - name: S3 contract
        env:
          SAPWOOD_TEST_S3_URL: s3://sapwood/ci
          AWS_ACCESS_KEY_ID: sapwood
          AWS_SECRET_ACCESS_KEY: sapwood-secret
          AWS_REGION: us-east-1
          AWS_ENDPOINT: http://localhost:9000
          AWS_ALLOW_HTTP: "true"
        run: cargo test -p sapwood-adapters --test contract --locked s3 -- --nocapture

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: sapwood:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
