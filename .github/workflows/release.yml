name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose container image to (re)build, e.g. v1.8.0
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu: binaries need glibc 2.35+ (Debian 12, Ubuntu 22.04, RHEL 10).
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin,       os: macos-latest }  # cross-compiled on arm64
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: arduino/setup-protoc@v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin sap --bin sapwood --bin git-remote-sapwood
      - name: Package
        shell: bash
        run: |
          name="sapwood-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/sap$ext" "target/${{ matrix.target }}/release/sapwood$ext" "target/${{ matrix.target }}/release/git-remote-sapwood$ext" README.md LICENSE "$name/"
          if [[ "$ext" == ".exe" ]]; then 7z a "$name.zip" "$name" >/dev/null; f="$name.zip"; else tar czf "$name.tar.gz" "$name"; f="$name.tar.gz"; fi
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: sapwood-*

  publish:
    needs: binaries
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Release notes from CHANGELOG
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*

  # Packages the published Linux binaries; no emulated compilation, so it takes a minute.
  image:
    needs: publish
    if: always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch release binaries
        run: |
          mkdir -p dist/data
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch=${pair%%:*}; target=${pair#*:}; name="sapwood-$TAG-$target"
            gh release download "$TAG" --pattern "$name.tar.gz*" --dir dl
            (cd dl && sha256sum -c "$name.tar.gz.sha256")
            tar xzf "dl/$name.tar.gz" -C dl
            mkdir -p "dist/$arch" && cp "dl/$name/sapwood" "dl/$name/sap" "dl/$name/git-remote-sapwood" "dist/$arch/"
          done
      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/${{ github.repository }}"
          {
            echo "list<<EOF"
            echo "$image:$TAG"
            # `latest` follows the newest release, so rebuilding an older tag never moves it back.
            [ "$(gh release view --json tagName -q .tagName)" = "$TAG" ] && echo "$image:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
      - name: Smoke test
        run: docker run --rm "ghcr.io/${{ github.repository }}:$TAG" --version
