name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose container image to (re)build, e.g. v1.8.0
        required: true

# Read-only by default; each job that writes asks for exactly what it needs.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu: binaries need glibc 2.35+ (Debian 12, Ubuntu 22.04, RHEL 10).
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin,       os: macos-latest }  # cross-compiled on arm64
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-pc-windows-msvc,    os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable, targets: "${{ matrix.target }}" }
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - run: cargo build --release --locked --target ${{ matrix.target }} --bin pando --bin pandod --bin git-remote-pando
      - name: Package
        shell: bash
        run: |
          name="pando-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/pando$ext" "target/${{ matrix.target }}/release/pandod$ext" "target/${{ matrix.target }}/release/git-remote-pando$ext" README.md LICENSE "$name/"
          if [[ "$ext" == ".exe" ]]; then 7z a "$name.zip" "$name" >/dev/null; f="$name.zip"; else tar czf "$name.tar.gz" "$name"; f="$name.tar.gz"; fi
          if command -v sha256sum >/dev/null; then sha256sum "$f" > "$f.sha256"; else shasum -a 256 "$f" > "$f.sha256"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.target }}
          path: pando-*

  # The web console's static files, built as the CI console job builds them; serve them with
  # `pandod server --console-dir` or any web server (docs/console.md).
  console:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { package_json_file: console/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: pnpm, cache-dependency-path: console/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Package
        run: |
          name="pando-console-${GITHUB_REF_NAME}"
          mv dist "$name"
          tar czf "../$name.tar.gz" "$name"
          cd .. && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: console
          path: pando-console-*

  publish:
    needs: [binaries, console]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # Sigstore signing of the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { path: dist, merge-multiple: true }
      # Signed SLSA build provenance for every archive (binaries and console): verify with
      # `gh attestation verify FILE --repo kabirnarang39/pando`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        id: provenance
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # The signed provenance also ships as a release asset, where verifiers (and the OpenSSF
      # Scorecard) look for it.
      - run: cp "${{ steps.provenance.outputs.bundle-path }}" "dist/pando-${{ github.ref_name }}.intoto.jsonl"
      # A software bill of materials for the release, attested against each archive.
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/pando-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
          sbom-path: dist/pando-${{ github.ref_name }}.spdx.json
      - name: Release notes from CHANGELOG
        run: awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: notes.md
          files: dist/*

  # Packages the published Linux binaries; no emulated compilation, so it takes a minute.
  image:
    needs: publish
    if: always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to ghcr.io
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch release binaries
        run: |
          mkdir -p dist/data
          for pair in amd64:x86_64-unknown-linux-gnu arm64:aarch64-unknown-linux-gnu; do
            arch=${pair%%:*}; target=${pair#*:}; name="pando-$TAG-$target"
            gh release download "$TAG" --pattern "$name.tar.gz*" --dir dl
            (cd dl && sha256sum -c "$name.tar.gz.sha256")
            tar xzf "dl/$name.tar.gz" -C dl
            mkdir -p "dist/$arch" && cp "dl/$name/pandod" "dl/$name/pando" "dl/$name/git-remote-pando" "dist/$arch/"
          done
      - name: Image tags
        id: tags
        run: |
          image="ghcr.io/${{ github.repository }}"
          {
            echo "list<<EOF"
            echo "$image:$TAG"
            # `latest` follows the newest release, so rebuilding an older tag never moves it back.
            [ "$(gh release view --json tagName -q .tagName)" = "$TAG" ] && echo "$image:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          provenance: mode=max
          sbom: true
      - name: Smoke test
        run: docker run --rm "ghcr.io/${{ github.repository }}:$TAG" --version

  # Package registries. Each is opt-in through a repository variable (Settings → Secrets and
  # variables → Actions → Variables) so a release never fails before its registry is set up.
  crates:
    needs: publish
    if: github.event_name == 'push' && vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  pypi:
    needs: publish
    if: github.event_name == 'push' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token stored in the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
        working-directory: sdk/python
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with: { packages-dir: sdk/python/dist }

  npm:
    needs: publish
    if: github.event_name == 'push' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      # Staged publishing: the token ("Read and write (stage only)") can only queue the version;
      # a maintainer approves it on npmjs.com with 2FA before it goes live. Needs npm >= 11.15.
      - run: npm install -g npm@11.16.0
      - run: npm ci && npm stage publish --provenance --access public
        working-directory: sdk/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
