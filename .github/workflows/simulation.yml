name: Simulation

# The landing simulation (crates/pando-server/tests/simulation.rs) runs 200 seeds in every
# CI build. This explores 50,000 new seeds a night; a failure prints the seed to replay.
on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # 50,000 seeds took 48 minutes for 3.3.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Run 50,000 seeds
        run: |
          base=$(( $(date +%s) / 86400 * 50000 ))
          echo "seed base $base"
          PANDO_SIM_SEED_BASE=$base PANDO_SIM_SEEDS=50000 \
            cargo test --release -p pando-server --test simulation -- --nocapture

  # The same invariants against real binaries: three replicas on Postgres, a proxy that cuts
  # connections mid-reply, replicas killed with SIGKILL and the database paused.
  chaos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { toolchain: stable }
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with: { repo-token: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Five minutes of chaos
        run: bench/chaos.sh 300
