[package]
name = "pando-vcs"
description = "Pando: source control for monorepos at agent scale. Command-line client (`pando`) and git remote helper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "pando"

[[bin]]
name = "pando"
path = "src/main.rs"

[[bin]]
name = "git-remote-pando"
path = "src/bin/git-remote-pando.rs"

[dependencies]
pando-core.workspace = true
pando-adapters.workspace = true
pando-proto.workspace = true
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
ignore.workspace = true
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
prost.workspace = true
quick_cache.workspace = true
reqwest.workspace = true
rustls.workspace = true
rmcp.workspace = true
schemars.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fuser.workspace = true

[target.'cfg(unix)'.dependencies]
nfsserve = "0.11"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_ProjectedFileSystem", "Win32_System_LibraryLoader"] }

[dev-dependencies]
jsonwebtoken = { workspace = true, features = ["use_pem"] }
pando-server.workspace = true
serde_json.workspace = true
tempfile.workspace = true
