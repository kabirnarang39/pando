syntax = "proto3";

// Canonical encodings of Pando's content-addressed objects. Ids are
// BLAKE3-256(tag || canonical bytes) with tag 1 = blob (raw file bytes, not a message),
// 2 = tree, 3 = changeset. Stored and wire payloads are `tag || zstd(bytes)`; a large file
// is stored under its blob id as `0x03 || Manifest`. `ChangesetInfo.encoded` carries a
// canonical Changeset.
package pando.objects.v1;

enum Mode {
  FILE = 0;
  EXEC = 1;
  SYMLINK = 2;
  DIR = 3;
}

// Directory entry. A tree's entries are sorted by name (bytewise) and names are unique.
message TreeEntry {
  string name = 1;
  Mode mode = 2;
  bytes id = 3;
}

message Tree {
  repeated TreeEntry entries = 1;
}

// Change relative to the changeset's first parent. Empty `blob` = delete.
message FileChange {
  string path = 1;
  bytes blob = 2;
  Mode mode = 3;
}

message Changeset {
  repeated bytes parents = 1;
  repeated FileChange changes = 2;
  string author = 3;
  string message = 4;
  int64 timestamp_ms = 5;
}

message ChunkRef {
  bytes id = 1;
  uint64 len = 2;
}

// Large file: content is the concatenation of the chunks (each a blob object).
message Manifest {
  uint64 size = 1;
  repeated ChunkRef chunks = 2;
}
