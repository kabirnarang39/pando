[package]
name = "sapwood"
description = "Sapwood: source control for monorepos at agent scale. Command-line client (`sap`) and git remote helper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "sap"

[[bin]]
name = "sap"
path = "src/main.rs"

[[bin]]
name = "git-remote-sapwood"
path = "src/bin/git-remote-sapwood.rs"

[dependencies]
sapwood-core.workspace = true
sapwood-adapters.workspace = true
sapwood-proto.workspace = true
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
futures.workspace = true
ignore.workspace = true
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
prost.workspace = true
quick_cache.workspace = true
rmcp.workspace = true
schemars.workspace = true
tokio.workspace = true
tonic.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fuser.workspace = true

[dev-dependencies]
jsonwebtoken = { workspace = true, features = ["use_pem"] }
sapwood-server.workspace = true
serde_json.workspace = true
tempfile.workspace = true
