[project]
name = "pando-vcs"
version = "3.2.0"
description = "Python client for Pando, source control for monorepos at agent scale"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["grpcio>=1.66", "protobuf>=5.28", "blake3>=1.0"]
keywords = ["source-control", "version-control", "monorepo", "grpc", "pando"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Version Control"]

[project.urls]
Homepage = "https://kabirnarang39.github.io/pando/"
Repository = "https://github.com/kabirnarang39/pando"

[dependency-groups]
dev = ["pytest>=8", "grpcio-tools>=1.66"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pando"]
